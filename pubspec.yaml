name: kele_music_client
description: 在线音乐客户端 (Android / iOS / macOS / Windows / Linux / Web)，基于 api-enhanced。
publish_to: 'none'
version: 1.1.0+4

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  go_router: ^13.1.0
  dio: ^5.4.0
  audio_service: ^0.18.12
  just_audio: ^0.9.34
  flutter_secure_storage: ^9.0.0
  cupertino_icons: ^1.0.2
  shared_preferences: ^2.2.2
  cached_network_image: ^3.3.1
  path_provider: ^2.1.1
  package_info_plus: ^8.0.0
  # 设置页「检查更新」：非 Android 平台跳转 GitHub Release 页
  url_launcher: ^6.3.0
  # 检查更新：校验镜像下载的 APK 完整性（GitHub asset 提供的 sha256 digest）
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

# kele-music 应用图标生成：dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/kele_music_master.png"
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/kele_music_master.png"
    background_color: "#FFF6E3"
    theme_color: "#F0790F"
  windows:
    generate: true
    image_path: "assets/icon/kele_music_master.png"
    icon_size: 48

flutter:
  uses-material-design: true
  assets:
    - assets/images/placeholder_cover.png
    - assets/config/app_config.json
